{
    "jobs" : [
        {
            "name" : "services:hiprofiler_daemon",
            "cmds" : [
                "mkdir /data/log/hiprofiler 0700 hiprofiler system"
            ]
        },
        {
            "name" : "param:hiviewdfx.hiprofiler.container_startup=*",
            "condition" : "hiviewdfx.hiprofiler.container_startup=*",
            "cmds" : [
                "ohsetprop heapprofd.startup ${hiviewdfx.hiprofiler.container_startup}"
            ]
        }
    ],
    "services" : [{
            "name" : "hiprofiler_daemon",
            "path" : ["/system/bin/native_daemon"],
            "sandbox" : 0,
            "caps" : ["CAP_KILL", "CAP_SYS_PTRACE", "CAP_DAC_READ_SEARCH"],
            "once" : 1,
            "uid" : "hiprofiler",
            "gid" : ["shell", "readproc", "system", "log"],
            "socket" : [{
                "name" : "hook_unix_socket",
                "family" : "AF_UNIX",
                "type" : "SOCK_STREAM",
                "protocol" : "default",
                "permissions" : "0666",
                "uid" : "hiprofiler",
                "gid" : "shell"
            }],
            "jobs" : {
                "on-start" : "services:hiprofiler_daemon"
            },
            "permission" : [
                "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
                "ohos.permission.GET_BUNDLE_INFO",
                "ohos.permission.DUMP"
            ],
            "permission_acls" : [
                "ohos.permission.GET_BUNDLE_INFO",
                "ohos.permission.DUMP"
            ],
            "secon" : "u:r:native_daemon:s0",
            "start-mode" : "condition"
        }, {
            "name" : "memory_collector",
            "path" : ["/system/bin/sa_main", "/system/profile/memory_collector.json"],
            "permission" : [
                "ohos.permission.ENABLE_PROFILER",
                "ohos.permission.GET_BUNDLE_INFO",
                "ohos.permission.DUMP"
            ],
            "permission_acls" : [
                "ohos.permission.GET_BUNDLE_INFO",
                "ohos.permission.DUMP"
            ],
            "sandbox" : 0,
            "caps" : ["CAP_KILL", "CAP_SYS_PTRACE"],
            "once" : 1,
            "uid" : "hiprofiler",
            "gid" : ["shell", "readproc", "system", "log"],
            "socket" : [{
                "name" : "hook_unix_socket",
                "family" : "AF_UNIX",
                "type" : "SOCK_STREAM",
                "protocol" : "default",
                "permissions" : "0666",
                "uid" : "hiprofiler",
                "gid" : "shell"
            }],
            "jobs" : {
                "on-start" : "services:hiprofiler_daemon"
            },
            "secon" : "u:r:native_daemon:s0",
            "start-mode" : "condition"
        }
    ]
}
